name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: python3 ../backend/security_audit.py npm
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t enterprise-ingestion-backend-test ./backend
      - run: docker run --rm enterprise-ingestion-backend-test pytest -q tests
      - run: docker run --rm enterprise-ingestion-backend-test ruff check --no-cache app tests migrations security_audit.py
      - run: docker run --rm enterprise-ingestion-backend-test pip check
      - run: docker run --rm enterprise-ingestion-backend-test python security_audit.py python

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      COMPOSE_PROJECT_NAME: ingestion-ci
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ci-postgres-only
      REDIS_PASSWORD: ci-redis-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait -d db cache api worker web
      - run: docker compose build tests
      - name: Regression tests against real PostgreSQL and Redis
        run: docker compose run --rm tests pytest -q tests
      - name: Fresh ingestion through Celery and persisted retrieval
        run: docker compose exec -T api python tests/integration_check.py
      - name: Verify frontend integration
        run: |
          curl --fail http://localhost:3000 > /dev/null
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:8000/docs > /dev/null
      - name: Integration must fail without a worker
        run: |
          docker compose stop worker
          if docker compose exec -T api python tests/integration_check.py; then
            echo 'ERROR: integration passed without a worker'
            exit 1
          fi
      - name: Verify real retry exhaustion and recovery
        run: |
          docker compose exec -T api python tests/live_recovery_check.py queue
          docker compose run -d --name ingestion-ci-outage-worker -e DATABASE_URL=postgresql://unavailable@127.0.0.1:1/ingestion_test worker
          docker compose exec -T api python tests/live_recovery_check.py await-retry
          docker stop ingestion-ci-outage-worker
          docker rm ingestion-ci-outage-worker
          docker compose start worker
          docker compose exec -T api python tests/live_recovery_check.py verify
      - name: Persistence after restart
        run: |
          docker compose restart db cache api worker web
          docker compose up --wait -d db cache api worker web
          docker compose exec -T api python tests/live_recovery_check.py verify
          docker compose exec -T api python tests/integration_check.py
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove disposable CI stack
        if: always()
        run: |
          docker rm -f ingestion-ci-outage-worker 2>/dev/null || true
          docker compose down --volumes --remove-orphans
