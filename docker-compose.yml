version: '3.8'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ingestion-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingestion-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sa_user:sa_secure_pass@db:5432/ingestion_db
      - REDIS_URL=redis://cache:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingestion-worker
    command: python -m celery -A app.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://sa_user:sa_secure_pass@db:5432/ingestion_db
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - api
      - cache
    restart: unless-stopped

  cache:
    image: redis:7.2-alpine
    container_name: ingestion-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ingestion-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sa_user
      - POSTGRES_PASSWORD=sa_secure_pass
      - POSTGRES_DB=ingestion_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa_user -d ingestion_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
